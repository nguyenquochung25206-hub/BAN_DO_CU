<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Đăng bán sản phẩm | REUSE</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/sell.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container sell-page">
    <nav class="sell-breadcrumb" aria-label="Đường dẫn">
      <a href="../index.html">Trang chủ</a><span aria-hidden="true">›</span><span id="page-context">Đăng bán</span>
    </nav>
    <header class="sell-heading">
      <div><p class="sell-eyebrow">REUSE MARKETPLACE</p><h1 id="sell-title">Đăng bán sản phẩm</h1>
        <p class="sell-intro">Chia sẻ món đồ bạn không còn dùng và tìm chủ mới cho nó.</p></div>
      <a class="btn btn-outline" href="my-products.html">Tin đăng của tôi</a>
    </header>

    <form id="sell-form" class="sell-form" enctype="multipart/form-data" novalidate>
      <section class="sell-section" aria-labelledby="details-title">
        <div class="sell-section__heading"><span class="sell-step">01</span><div><h2 id="details-title">Thông tin sản phẩm</h2><p>Các trường có dấu * là bắt buộc.</p></div></div>
        <div class="sell-fields">
          <div class="form-group sell-field--wide">
            <label class="form-label" for="sell-name">Tên sản phẩm <span aria-hidden="true">*</span></label>
            <input class="form-input" id="sell-name" name="name" type="text" maxlength="200" minlength="3" required placeholder="Ví dụ: Tai nghe Sony WH-1000XM4">
            <p class="sell-field-error" data-error-for="name" role="alert"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="sell-price">Giá bán (₫) <span aria-hidden="true">*</span></label>
            <div class="sell-price-wrap"><input class="form-input" id="sell-price" name="price" type="number" min="1" max="9999999999" step="1" required inputmode="numeric" placeholder="0"><span>₫</span></div>
            <p class="sell-field-error" data-error-for="price" role="alert"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="sell-category">Danh mục <span aria-hidden="true">*</span></label>
            <select class="form-input" id="sell-category" name="category_id" required><option value="">Đang tải danh mục…</option></select>
            <p class="sell-field-error" data-error-for="category_id" role="alert"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="sell-condition">Tình trạng <span aria-hidden="true">*</span></label>
            <select class="form-input" id="sell-condition" name="condition" required>
              <option value="">Chọn tình trạng</option><option value="new">Mới 100%</option><option value="like_new">Như mới (~99%)</option><option value="good">Tốt (~90%)</option><option value="fair">Khá (~70%)</option>
            </select>
            <p class="sell-field-error" data-error-for="condition" role="alert"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="sell-location">Khu vực <span aria-hidden="true">*</span></label>
            <!--
              Danh sách chọn cố định để biểu mẫu hoạt động ngay cả khi sell.js không tải khu vực.
              Nếu nhóm đã chốt danh sách/giá trị khu vực khác ở backend, hãy đồng bộ lại các value.
            -->
            <select class="form-input" id="sell-location" name="location" required>
              <option value="">Chọn khu vực</option>
              <optgroup label="Thành phố trực thuộc trung ương">
                <option value="Hà Nội">Hà Nội</option>
                <option value="Hải Phòng">Hải Phòng</option>
                <option value="Huế">Huế</option>
                <option value="Đà Nẵng">Đà Nẵng</option>
                <option value="Cần Thơ">Cần Thơ</option>
                <option value="TP. Hồ Chí Minh">TP. Hồ Chí Minh</option>
              </optgroup>
              <optgroup label="Tỉnh">
                <option value="An Giang">An Giang</option>
                <option value="Bắc Ninh">Bắc Ninh</option>
                <option value="Cà Mau">Cà Mau</option>
                <option value="Cao Bằng">Cao Bằng</option>
                <option value="Đắk Lắk">Đắk Lắk</option>
                <option value="Điện Biên">Điện Biên</option>
                <option value="Đồng Nai">Đồng Nai</option>
                <option value="Đồng Tháp">Đồng Tháp</option>
                <option value="Gia Lai">Gia Lai</option>
                <option value="Hà Tĩnh">Hà Tĩnh</option>
                <option value="Hưng Yên">Hưng Yên</option>
                <option value="Khánh Hòa">Khánh Hòa</option>
                <option value="Lai Châu">Lai Châu</option>
                <option value="Lâm Đồng">Lâm Đồng</option>
                <option value="Lạng Sơn">Lạng Sơn</option>
                <option value="Lào Cai">Lào Cai</option>
                <option value="Nghệ An">Nghệ An</option>
                <option value="Ninh Bình">Ninh Bình</option>
                <option value="Phú Thọ">Phú Thọ</option>
                <option value="Quảng Ngãi">Quảng Ngãi</option>
                <option value="Quảng Ninh">Quảng Ninh</option>
                <option value="Quảng Trị">Quảng Trị</option>
                <option value="Sơn La">Sơn La</option>
                <option value="Tây Ninh">Tây Ninh</option>
                <option value="Thái Nguyên">Thái Nguyên</option>
                <option value="Thanh Hóa">Thanh Hóa</option>
                <option value="Tuyên Quang">Tuyên Quang</option>
                <option value="Vĩnh Long">Vĩnh Long</option>
              </optgroup>
            </select>
            <p class="sell-field-error" data-error-for="location" role="alert"></p>
          </div>
          <div class="form-group sell-field--wide">
            <label class="form-label" for="sell-description">Mô tả <span aria-hidden="true">*</span></label>
            <textarea class="form-input sell-description" id="sell-description" name="description" rows="6" maxlength="5000" required placeholder="Mô tả tình trạng, tính năng, phụ kiện đi kèm…"></textarea>
            <div class="sell-description-meta"><p class="sell-field-error" data-error-for="description" role="alert"></p><span id="description-count">0 / 5000</span></div>
          </div>
        </div>
      </section>

      <section class="sell-section" aria-labelledby="photos-title">
        <div class="sell-section__heading"><span class="sell-step">02</span><div><h2 id="photos-title">Hình ảnh sản phẩm</h2><p>Thêm 1–5 ảnh rõ nét, tối đa 5 MB mỗi ảnh. Hỗ trợ JPG, PNG và WebP.</p></div></div>
        <div id="existing-photos" class="sell-photo-grid" aria-label="Ảnh hiện có" hidden></div>
        <label class="sell-upload" for="sell-images">
          <span class="sell-upload__icon" aria-hidden="true">＋</span><span class="sell-upload__title">Chọn ảnh sản phẩm</span><span class="sell-upload__hint">Có thể chọn nhiều ảnh cùng lúc</span>
          <input id="sell-images" name="images" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple>
        </label>
        <p class="sell-field-error" data-error-for="images" role="alert"></p>
        <div id="photo-preview" class="sell-photo-grid" aria-live="polite"></div>
      </section>

      <div id="sell-message" class="sell-message" role="status" aria-live="polite" hidden></div>
      <div class="sell-actions">
        <a class="btn btn-outline" href="my-products.html">Hủy</a>
        <button id="sell-submit" class="btn btn-primary" type="submit"><span id="submit-label">Đăng sản phẩm</span><span class="sell-spinner" aria-hidden="true" hidden></span></button>
      </div>
    </form>
  </main>

  <div id="site-footer"></div>
  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/sell.js"></script>
</body>
</html>
